# Opt-in rust-llm-tidy config example.
#
# This file is not discovered automatically. Copy it to
# `.rust-llm-tidy.yml`, or run:
#
#   rust-llm-tidy --config .rust-llm-tidy.example.yml

# ── License documents ──
# Conventional LICENSE/LICENCE/COPYING documents are excluded by default.
# Set false to allow normal discovery; extension filters, exclude_files,
# and rule selection still apply.

# exclude_license_documents: true

# ── Extensions ──
# Allowed file extensions, matched case-insensitively.
# `extensions` replaces the defaults when non-empty; `extra_extensions`
# adds on top of the effective list.

# extensions:
#   - rs
#   - md
# extra_extensions:
#   - vim
# Unmapped extensions explicitly declare source for DUP001 only. They do not
# enable transformations. Known prose/config/data profiles stay excluded.

# ── Same-file duplication (DUP001) ──
# Enabled by default; complete changed runs query the whole current file.
# No cross-file matches or automatic extraction. Repeated runs can repeat findings.

# duplication:
#   min_meaningful_lines: 5  # lines containing a Unicode letter or number; >= 1.
#   min_occurrences: 3      # distinct non-overlapping sites including query; >= 2.
#   exact_whitespace: false # true also preserves line edges and line endings.

# ── Passive narration (TEXT007) ──
# Enabled by default as a reminder on changed lines.

# passive_narration:
#   enable: false                   # disable passive-narration reminders.
#   suppress_in_release_notes: true # keep narration markers out of
#                                   # CHANGELOG*/MIGRATION*/releases/**
#                                   # notes; passive voice still reports.

# ── Link hoisting ──
# The `links` op hoists inline links `[text](url)` to `[text]` plus a
# definition. Effective threshold: `by_extension[ext]`, else
# `min_occurrences`, else 1.

# links:
#   min_occurrences: 2        # hoist a pair only after this many uses; >= 1.
#   by_extension: { rs: 2 }   # per-extension override; unknown keys are inert.

# ── File size (MOD001) ──
# Code files count all physical lines: blanks, comments, tests. Recognized
# module headers (leading file comments, `//!` docs, Python's module
# docstring) stay out of the count by default.

# module_size:
#   max_lines: 500                # warning above this budget; >= 1.
#   include_non_code: false       # also check selected config/data/prose files.
#   include_in_file_tests: false  # include Rust's in-file test modules. #[cfg(test)]
#   include_test_files: false     # include Rust files under tests/ directories.
#   exclude_module_headers: true  # keep module headers out of the count.

# ── Method length (LEN001) ──
# Suggest reviewing Rust function bodies over this code-line limit.
# Enable LEN001 or lints in the whitelist below.

# method_length:
#   max_lines: 100  # hint above this budget; >= 1.

# ── Reporting scope ──
# Reminders default to changed lines; other severities default to all.
# Override per lint below, or use --all-lines for all reporting scopes.

# lint_scopes:
#   SYM: all
#   DOC001: changed_lines
#   DUP001: all # whole-file queries, even without Git

# ── Symbol policies (SYM) ──
# Add text/symbol hints or exclude declarations from lints and edits.
# Full reference:
# https://github.com/Sewer56/rust-llm-tidy/blob/main/docs/symbol-rules.md

# symbol_rules:
#   - symbol: to_string
#     title: Review conversion
#     languages: [rust]
#     message: |
#       Review this conversion.
#       Why: Ownership may be unnecessary.
#       Suggestions:
#       - Borrow when the caller does not need owned text.
#   - symbol: new[]
#     title: Array initialization
#     extensions: [CS]
#     array_kind: explicit_sized_vector
#     no_initializer: true
#     message: |
#       Review array initialization.
#       Why: Zero values may be required by later reads.
#       Suggestions:
#       - Keep regular allocation unless every element is written first.
#   - regex: 'internal::.*'
#     extensions: [rs]
#     target: declaration
#     action: exclude
#     exclude_lints: [DOC001] # true: all; false or []: none. Default true.
#     exclude_edits: false    # keep edits enabled. Default true.
#     exclude_post_process: false # true skips external tools for the file. Default false.

# Built-in SYM reminders (both enabled by default):
# - PERF001: container capacity
# - PERF002: C# array initialization
# [] disables built-ins, not custom symbol_rules.

# perf_hints: [PERF001, PERF002]

# ── Post-processing ──
# External commands run on every processed file; the file path is appended
# as the last argument. `extensions` filters (empty = all). Skipped under
# `--dry-run` and for excluded files; non-zero exit or spawn failure fails
# the run.

# post_process:
#   - command: "rustfmt"
#     args: ["--edition", "2024"]
#     extensions: ["rs"]

# ── Rule selection ──
# Rule-selection keys (`include` and `exclude` are mutually exclusive):
#   include:        whitelist - run ONLY these rules for matched paths.
#                   A file matching no group runs nothing.
#   exclude:        blacklist - never run these rules for matched paths.
#   exclude_files:  skip ALL processing for matched files.
#
# Omitting `paths` in a group implies `["**"]` (all paths). Paths/globs are
# relative to this file's directory and use glob semantics (`*` does not
# cross `/`; `**` recurses).
#
# New rules added by a future release stay disabled until added here; pin
# the version used by CI and upgrade deliberately instead.

# exclude_files:
#   - "**/generated/**"

# exclude:
#   - paths: ["**/tests/**"]
#     rules: [reorder, vis]

include:
  - paths: ["**"]
    rules:
      # Level 1: Markdown/doc-comment formatting.
      - tables
      - fences
      - links

      # Level 2: Rust source cleanup.
      # Uncomment these when wanted.
      # - reorder
      # - vis

      # Level 3: documentation, test-name, and file-size checks.
      # `lints` enables all registered lint families together.
      # Uncomment to enable the complete lint pass.
      # - lints

      # Pin lint checks instead of enabling the whole `lints` group when
      # future lint additions must stay disabled until explicitly accepted.
      # - DOC001  # missing documentation
      # - DOC002  # missing `# Errors` section
      # - DOC003  # vague `# Errors` section
      # - DOC004  # missing `# Arguments` section
      # - DOC005  # undocumented parameter
      # - DOC006  # placeholder text
      #
      # Text checks:
      # - TEXT001 # oversized paragraph
      # - TEXT002 # long line
      # - TEXT003 # long sentence
      # - TEXT004 # header opener shape
      # - TEXT005 # untagged fenced code block
      # - TEXT006 # verbose synonym
      # - TEXT007 # passive narration reminders
      # - TEXT008 # dense bullet list
      # - TEST001 # non-behavioral test name
      # - MOD001  # oversized code file
      # - MOD002  # function-local `use` without `#[cfg]`
      # - LEN001  # oversized Rust function or method
      # Built-in performance families are selected with perf_hints above.
      # - SYM     # configured text and symbol hints
      # - DUP001  # same-file textual duplication reminders
