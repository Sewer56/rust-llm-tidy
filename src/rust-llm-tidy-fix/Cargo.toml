[package]
name = "rust-llm-tidy-fix"
version = "0.3.0"
edition = "2024"
description = "Realigns markdown tables and fixes nested code fences in place. Intended for LLM use."
repository = "https://github.com/Sewer56/rust-llm-tidy"
license = "Apache-2.0"
include = ["src/**/*"]
readme = "README.MD"
# keywords (search terms): https://crates.io/keywords
keywords = ["markdown", "table", "fence", "fix"]
# categories (fixed list): https://crates.io/categories
categories = ["command-line-utilities"]

# Benchmark for the `fix_tables` pass over embedded real-world fixtures.
# `harness = false` enables the criterion entry point in `benches/fix.rs`.
[[bench]]
name = "fix"
harness = false

[dependencies]
memchr = "2"
smallvec = "1"

[dev-dependencies]
# Benchmark-only dependency.
criterion = "0.8"
