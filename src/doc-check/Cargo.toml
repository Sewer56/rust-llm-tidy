[package]
name = "rust-doc-check"
version = "0.1.0"
edition = "2024"
description = "Documentation linter for Rust source files. Checks for missing docs and incomplete error sections."
repository = "https://github.com/Sewer56/rust-auto-reorder"
license = "Apache-2.0"
include = ["src/**/*"]
# keywords (search terms): https://crates.io/keywords
keywords = ["rust", "docs", "lint", "clippy", "documentation"]
# categories (fixed list): https://crates.io/categories
categories = ["development-tools"]

[dependencies]
rust-source-model = { path = "../rust-source-model", version = "0.1.0" }

[dev-dependencies]
