[package]
name = "rust-llm-tidy-model"
version = "0.1.0"
edition = "2024"
description = "Shared Rust source model: parse top-level items with spans, visibility, and doc comments."
repository = "https://github.com/Sewer56/rust-llm-tidy"
license = "Apache-2.0"
include = ["src/**/*"]
# keywords (search terms): https://crates.io/keywords
keywords = ["rust", "syn", "ast", "source", "model"]
# categories (fixed list): https://crates.io/categories
categories = ["development-tools"]

[dependencies]
anyhow = "1"
syn = { version = "2", features = ["full", "visit", "parsing"] }
quote = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
memchr = "2"
tempfile = "3"

[dev-dependencies]
