[package]
name = "rust-llm-tidy-model"
version = "0.3.1"
edition = "2024"
description = "Shared language-neutral source items, spans, and parse results."
repository = "https://github.com/Sewer56/rust-llm-tidy"
license = "Apache-2.0"
include = ["src/**/*"]
# keywords (search terms): https://crates.io/keywords
keywords = ["rust", "tree-sitter", "ast", "source", "model"]
# categories (fixed list): https://crates.io/categories
categories = ["development-tools"]

[dependencies]
anyhow = "1"
tree-sitter = "0.26"
ahash = "0.8"
tempfile = "3"

[dev-dependencies]
