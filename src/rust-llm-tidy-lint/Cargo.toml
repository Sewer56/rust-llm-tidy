[package]
name = "rust-llm-tidy-lint"
version = "0.2.0"
edition = "2024"
description = "Linter for Rust source files. Checks for missing docs, incomplete error/arguments sections, placeholders, and test naming."
repository = "https://github.com/Sewer56/rust-llm-tidy"
license = "Apache-2.0"
include = ["src/**/*"]
# keywords (search terms): https://crates.io/keywords
keywords = ["rust", "lint", "clippy", "docs"]
# categories (fixed list): https://crates.io/categories
categories = ["development-tools"]

[dependencies]
rust-llm-tidy-model = { path = "../rust-llm-tidy-model", version = "0.2.0" }

[dev-dependencies]
