[package]
name = "rust-llm-tidy-vis"
version = "0.1.2"
edition = "2024"
description = "Narrows bare `pub` items nested inside restricted-visibility inline modules to the module's visibility. Intended for LLM use."
repository = "https://github.com/Sewer56/rust-llm-tidy"
license = "Apache-2.0"
include = ["src/**/*"]
readme = "README.MD"
# keywords (search terms): https://crates.io/keywords
keywords = ["rust", "tree-sitter", "visibility", "refactor", "lint"]
# categories (fixed list): https://crates.io/categories
categories = ["development-tools"]

[dependencies]
# `narrow_vis_in_tree` and `build_module_tree` walk a tree-sitter CST directly
# (byte offsets, no line/column conversion), so this crate does not depend on
# `rust-llm-tidy-model` (whose gap-anchored span extraction and item
# classification it would discard). Parses with the `tree-sitter-rust` grammar.
anyhow = "1"
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
ahash = "0.8"
cargo_metadata = "0.23" # crate-root discovery for cross-file vis (P1); pin/adjust to latest 0.x
