[package]
name = "rust-llm-tidy-cli"
version = "0.1.2"
edition = "2024"
description = "CLI for reordering and linting Rust source code. Intended for LLM use."
repository = "https://github.com/Sewer56/rust-llm-tidy"
license = "Apache-2.0"
readme = "README.MD"
# keywords (search terms): https://crates.io/keywords
keywords = ["cli", "rust", "reorder", "lint", "tidy"]
# categories (fixed list): https://crates.io/categories
categories = ["command-line-utilities"]

[[bin]]
name = "rust-llm-tidy"
path = "src/main.rs"

# Benchmarks for the two CLI operations (lint and reorder) over embedded
# real-world source fixtures. `harness = false` enables the criterion entry
# point defined in each bench file.
[[bench]]
name = "lint"
harness = false

[[bench]]
name = "reorder"
harness = false

[[bench]]
name = "fences"
harness = false

[[bench]]
name = "vis"
harness = false

[[bench]]
name = "links"
harness = false

[dependencies]
rust-llm-tidy-reorder = { path = "../rust-llm-tidy-reorder", version = "0.1.2" }
rust-llm-tidy-lint = { path = "../rust-llm-tidy-lint", version = "0.2.0" }
rust-llm-tidy-model = { path = "../rust-llm-tidy-model", version = "0.2.0" }
rust-llm-tidy-fix = { path = "../rust-llm-tidy-fix", version = "0.2.0" }
rust-llm-tidy-vis = { path = "../rust-llm-tidy-vis", version = "0.1.2" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.13"
globset = "0.4"
glob = "0.3"
ignore = "0.4"

[dev-dependencies]
criterion = "0.8"
