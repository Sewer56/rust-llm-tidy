[package]
name = "rust-llm-tidy-cli"
version = "0.1.0"
edition = "2024"
description = "CLI for reordering and linting Rust source code. Intended for LLM use."
repository = "https://github.com/Sewer56/rust-llm-tidy"
license = "Apache-2.0"
readme = "README.MD"
# keywords (search terms): https://crates.io/keywords
keywords = ["cli", "rust", "rustfmt", "reorder", "lint", "tidy"]
# categories (fixed list): https://crates.io/categories
categories = ["command-line-utilities"]

[[bin]]
name = "rust-llm-tidy"
path = "src/main.rs"

# Benchmarks for the two CLI operations (lint and reorder) over embedded
# real-world source fixtures. `harness = false` enables the criterion entry
# point defined in each bench file.
[[bench]]
name = "lint"
harness = false

[[bench]]
name = "reorder"
harness = false

[[bench]]
name = "vis"
harness = false

[dependencies]
rust-llm-tidy-reorder = { path = "../rust-llm-tidy-reorder", version = "0.1.0" }
rust-llm-tidy-lint = { path = "../rust-llm-tidy-lint", version = "0.1.0" }
rust-llm-tidy-model = { path = "../rust-llm-tidy-model", version = "0.1.0" }
rust-llm-tidy-fix = { path = "../rust-llm-tidy-fix", version = "0.1.0" }
rust-llm-tidy-vis = { path = "../rust-llm-tidy-vis", version = "0.1.0" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "2", features = ["full", "parsing"] }

[dev-dependencies]
criterion = "0.8"
