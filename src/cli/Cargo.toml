[package]
name = "rust-llm-tidy-cli"
version = "0.7.0"
edition = "2024"
description = "CLI for linting and tidying Rust, C#, and documentation source."
repository = "https://github.com/Sewer56/rust-llm-tidy"
license = "Apache-2.0"
readme = "README.MD"
# keywords (search terms): https://crates.io/keywords
keywords = ["cli", "rust", "reorder", "lint", "tidy"]
# categories (fixed list): https://crates.io/categories
categories = ["command-line-utilities"]

[lints]
workspace = true

[[bin]]
name = "rust-llm-tidy"
path = "src/main.rs"
doc = false

# Folder-rooted integration test. Cargo auto-discovers only `tests/*.rs` and
# `tests/*/main.rs`, so the `mod.rs` root is declared explicitly here.
[[test]]
name = "doc_check"
path = "tests/doc_check/mod.rs"

[dependencies]
rust-llm-tidy = { path = "../rust-llm-tidy", version = "0.3.0" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
rstest = "0.27.0"
tempfile = "3"
