[package]
name = "rust-llm-tidy-reorder"
version = "0.1.3"
edition = "2024"
description = "Rust project for automatically reordering Rust source code. Intended for LLM use."
repository = "https://github.com/Sewer56/rust-llm-tidy"
license = "Apache-2.0"
include = ["src/**/*"]
readme = "README.MD"
# keywords (search terms): https://crates.io/keywords
keywords = ["rust", "tree-sitter", "ast", "reorder", "refactor"]
# categories (fixed list): https://crates.io/categories
categories = ["development-tools"]

[dependencies]
rust-llm-tidy-model = { path = "../rust-llm-tidy-model", version = "0.3.0" }
anyhow = "1"
tree-sitter = "0.26"
ahash = "0.8"

[dev-dependencies]
