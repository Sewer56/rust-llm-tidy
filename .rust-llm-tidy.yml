# rust-llm-tidy config.
#
# Paths/globs are relative to this file's directory and use glob semantics
# (`*` does not cross `/`; `**` recurses). The config is discovered by walking
# up from the current directory to the repo root; the first match wins.
#
# Override with `--config <PATH>`; disable with `--no-config`. Every config
# error - bad YAML, unknown rule, bad glob, or a pattern matching zero files -
# exits non-zero; run `rust-llm-tidy --validate` to check without processing.
#
# Rule-selection keys (`include` and `exclude` are mutually exclusive):
#   include:        whitelist - run ONLY these rules for matched paths.
#                   A file matching no group runs nothing.
#   exclude:        blacklist - never run these rules for matched paths.
#   exclude_files:  skip ALL processing for matched files.
# 
# Omitting `paths` in a group implies `["**"]` (all paths).
#
# Rule names (used in include.rules, exclude.rules, --include, --exclude):
# ops tables, fences, links, reorder, vis, lints - plus lint codes
# DOC001-DOC006 and TEST001. The `lints` op groups all seven lint codes.

# Skip ALL processing for files matching any pattern.
exclude_files:
  # Test fixtures are intentional fragments, not compilable units; tidying
  # would corrupt them.
  - "**/tests/fixtures/**"
  - "**/benches/fixtures/**"

# Disable specific rules for files matching a group's patterns.
exclude:
  # Integration tests embed markdown (`[text](url)`) in Rust string literals.
  # `fix_links` would emit a `[text]: url` definition outside the literal and
  # break compilation, so disable `links`.
  - paths:
      - "src/cli/tests/**"
    rules:
      - links
  # The README has a nested-fence before+after example that `fix_fences`
  # would corrupt.
  - paths:
      - "src/rust-llm-tidy-fix/README.MD"
    rules:
      - fences
  # docs/tables.md shows a deliberately misaligned "Before" table inside a
  # fenced example; `fix_tables` realigns it, destroying the illustration.
  - paths:
      - "docs/tables.md"
    rules:
      - tables
  # rust-llm-tidy-fix's own docs/examples deliberately embed markdown-bracket
  # and fence-heavy text; the links/fences ops rewrite those destructively and
  # break parsing. Only those two ops are disabled; reorder/vis/tables/lints
  # still apply.
  - paths:
      - "src/rust-llm-tidy-fix/src/lib.rs"
      - "src/rust-llm-tidy-fix/src/links/mod.rs"
      - "src/rust-llm-tidy-fix/src/links/scan.rs"
    rules:
      - links
      - fences

# Commented examples (uncomment and tailor paths to enable):
#
# include:                       # whitelist mode
#   - rules: [tables]            # paths omitted -> implied ["**"]
#   - paths: ["src/**/*.rs"]
#     rules: [reorder, vis]
#
# exclude:
#   - paths: ["**/generated/**"]
#     rules: [reorder, vis, lints]

# Runs a command on every modified file (path appended as last arg).
# `extensions` filters by extension (empty = all). Mutating runs only - skipped
# under --dry-run and for excluded files. Non-zero exit or spawn failure
# propagates.
post_process:
  - command: "rustfmt"
    args: ["--edition", "2024"]
    extensions: ["rs"]
