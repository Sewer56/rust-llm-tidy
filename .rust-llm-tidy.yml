# rust-llm-tidy config.
#
# Paths/globs are relative to this file's directory and use glob semantics
# (`*` does not cross `/`; `**` recurses). The config is discovered by walking
# up from the current directory to the repo root; the first match wins.
#
# Override with `--config <PATH>`; disable with `--no-config`. Every config
# error - bad YAML, unknown rule, bad glob, or a pattern matching zero files -
# exits non-zero; run `rust-llm-tidy --validate` to check without processing.
#
# Rule-selection keys (`include` and `exclude` are mutually exclusive):
#   include:        whitelist - run ONLY these rules for matched paths.
#                   A file matching no group runs nothing.
#   exclude:        blacklist - never run these rules for matched paths.
#   exclude_files:  skip ALL processing for matched files.
# 
# Omitting `paths` in a group implies `["**"]` (all paths).
#
# Rule names (used in include.rules, exclude.rules, --include, --exclude):
# ops tables, fences, links, reorder, vis, lints - plus lint codes
# (`DOC*`, `TEXT*`, `TEST*` families). The `lints` op groups them all.
#
# The `links` op hoists inline links `[text](url)` to `[text]` + a definition
# (threshold 1 by default) in verified standalone `.rs` doc-comment groups
# and whole markdown-family documents. Tune it per file:
#   links:
#     min_occurrences: 2        # hoist a pair only after this many uses; >= 1.
#     by_extension: { rs: 2 }   # per-extension override; unknown keys are inert.
# Effective threshold: by_extension[ext] else min_occurrences else 1.
#
# MOD001 checks code files by default. Options do not broaden file discovery.
#   module_size:
#     max_lines: 500            # counted line budget per file; >= 1.
#     include_non_code: false  # also check selected config, data, and prose files
#     include_in_file_tests: false # count Rust's #[cfg(test)] mod regions
#     include_test_files: false # include Rust files under tests/ directories
# Other languages always count inline tests and test files.
# Unsupported extensions remain exempt even with include_non_code enabled.
# Effective threshold: max_lines else 500.

links:
  min_occurrences: 1

# This repo's tests/ modules are first-class code; size-check them too.
# Inline #[cfg(test)] regions in src files stay exempt by default.
module_size:
  include_test_files: true

# Skip ALL processing for files matching any pattern.
exclude_files:
  # Test fixtures are intentional fragments, not compilable units; tidying
  # would corrupt them.
  - "**/tests/fixtures/**"
  - "**/benches/fixtures/**"
  # Git submodules are their own repos (own URL/ref); tidying their checked-out
  # content would dirty the gitlink and produce a spurious diff upstream.
  - "**/submodules/**"
  # Verification scripts use a terse step-banner comment style whose opener
  # exceeds the TEXT004 budget; they are operational scripts, not docs.
  - "src/.llm/verify.sh"
  - "src/.llm/verify.ps1"

# Disable specific rules for files matching a group's patterns.
exclude:
  # TEMPORARY: TEST002 disabled repo-wide until the test-summary backfill lands.
  - rules: [TEST002]
  # Keep the TEXT007 detection-pattern reference list together.
  - paths: ["docs/text-lints.md"]
    rules: [TEXT008]
  - paths: ['**/AGENTS.md']
    rules: [lints]
  # Rust string fixtures are immutable to pipeline text fixes. This real doc
  # comment illustrates `items[i](count)` syntax, which links would hoist.
  - paths:
      - "src/cli/tests/fix/links.rs"
    rules:
      - links
  # This page has a nested-fence before+after example that `fix_fences`
  # would corrupt, and inline-code `[text](url)` examples that `fix_links`
  # hoists into a bogus `[text]: url` definition. Disable both ops here.
  - paths:
      - "docs/fences.md"
    rules:
      - fences
      - links
  # docs/tables.md shows a deliberately misaligned "Before" table inside a
  # fenced example; `fix_tables` realigns it, destroying the illustration.
  - paths:
      - "docs/tables.md"
    rules:
      - tables
  # docs/links.md documents the links op with literal `[text](url)` example
  # source forms; `fix_links` hoists those and emits a `[text]: url`
  # definition, corrupting the doc.
  - paths:
      - "docs/links.md"
    rules:
      - links
  # Real Rust doc comments contain literal link syntax and fence examples.
  # Keep those examples unchanged; reorder/vis/tables/lints still apply.
  - paths:
      - "src/rust-llm-tidy/src/rules/transform/mod.rs"
      - "src/rust-llm-tidy/src/rules/transform/links/mod.rs"
      - "src/rust-llm-tidy/src/rules/transform/links/scan.rs"
    rules:
      - links
      - fences
  # Embedded fixtures intentionally contain openers that trigger TEXT004.
  - paths:
      - "src/rust-llm-tidy/src/rules/lint/text/text001_paragraph_size.rs"
      - "src/rust-llm-tidy/src/rules/lint/text/text004_header_opener.rs"
    rules: [TEXT004]
  # The wording dictionary is one flat sorted table; a split makes no sense.
  - paths:
      - "src/rust-llm-tidy/src/rules/lint/text/text006_verbose_synonyms/suggestions.rs"
    rules: [MOD001]
  # .github holds plain markdown (workflows/templates) outside any Rust crate;
  # `vis` can't (and needn't) do crate-aware narrowing there.
  - paths:
      - ".github/**"
    rules:
      - vis
  # The repo's own `.yml`/`.toml` files (now default-on comment
  # extensions) carry long comment paragraphs; lints stay off until
  # they are cleaned.
  - paths:
      - "*.yml"
      - "**/*.yml"
      - "*.toml"
      - "**/*.toml"
    rules:
      - lints
  # DOC006 self-reference: these docs spell the markers (e.g. `` `TODO` ``) as
  # examples of what DOC006 detects; whole-word match flags the literal ref.
  - paths:
      - "src/rust-llm-tidy/src/rules/lint/rust/doc006_placeholder.rs"
    rules:
      - DOC006
  # Tests reference placeholder markers and keep module/case lists together.
  - paths: ["src/cli/tests/doc_check/**/*"]
    rules: [DOC006, TEXT008]
  # The MOD001 acceptance matrix is intentionally one file; it sits a few
  # lines over the 500-line budget and no split improves it.
  - paths: ["src/cli/tests/doc_check/mod001_module_size.rs"]
    rules: [MOD001]

# Commented examples (uncomment and tailor paths to enable):
#
# include:                       # whitelist mode
#   - rules: [tables]            # paths omitted -> implied ["**"]
#   - paths: ["src/**/*.rs"]
#     rules: [reorder, vis]
#
# exclude:
#   - paths: ["**/generated/**"]
#     rules: [reorder, vis, lints]

# Runs a command on every modified file (path appended as last arg).
# `extensions` filters by extension (empty = all). Mutating runs only - skipped
# under --dry-run and for excluded files. Non-zero exit or spawn failure
# propagates.
post_process:
  - command: "rustfmt"
    args: ["--edition", "2024"]
    extensions: ["rs"]
