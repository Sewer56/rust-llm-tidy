name: Tidy

on:
  pull_request:
    paths:
      - "src/**"
      - "**/*.md"
      - ".rust-llm-tidy.yml"
      # Shell scripts are admitted source files (table fixes inside `#`
      # comments); the repo hook lives outside src/**.
      - ".githooks/**"

jobs:
  tidy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Check out the PR branch head, not the auto-generated merge ref:
          # apply-mode commits on top of HEAD and pushes back to this branch,
          # which would be a non-fast-forward from the merge commit.
          ref: ${{ github.head_ref }}
          submodules: recursive

      - name: Run rust-llm-tidy
        uses: ./submodules/action
        with:
          # Build the binary from this repo's own source checkout.
          binary-source: git
          source-path: ${{ github.workspace }}
          # Apply tidy fixes in place; on a PR commit and push them to the branch.
          # Whole-repo scope covers every admitted source file: Rust, the
          # markdown family, C#, and the repo's shell scripts:
          # src/.cargo/verify.sh and .githooks/pre-commit.d/10-tidy-rust.sh.
          # No gate step runs here. On PRs the Rust CI also covers
          # (src/** changes), the corpus integration test
          # (repo_corpus_dry_run_emits_zero_change_records in
          # src/cli/tests/integration.rs) fails whenever any tracked file
          # would produce a change record. PRs outside src/** carry no
          # corpus run; apply commits the fix directly instead, so the
          # tree self-heals either way.
          mode: apply
          # Tidy the whole repository (no paths -> '.' under rust-project-path).
          changed-files: false
